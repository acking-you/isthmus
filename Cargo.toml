[workspace]
# Every library and the CLI live under `crates/`. The FFI cdylib stays next to
# the Flutter code that loads it.
members = ["crates/*", "ui/native/isthmus_ffi"]
# Spelled out: a virtual manifest does not infer the resolver from the edition,
# and without this it silently falls back to resolver 1.
resolver = "3"

[workspace.package]
# `version` must stay the first key here: release tooling reads it by position.
version = "0.1.1"
authors = ["L_B__"]
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
isthmus-core = { path = "crates/isthmus-core", version = "0.1.0" }
isthmus-input = { path = "crates/isthmus-input", version = "0.1.0" }
isthmus-link = { path = "crates/isthmus-link", version = "0.1.0" }
isthmus-awake = { path = "crates/isthmus-awake", version = "0.1.0" }
isthmus-clipboard = { path = "crates/isthmus-clipboard", version = "0.1.0" }

clap = { version = "4.5", features = ["derive"] }
libc = "0.2.190"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
snafu = "0.9.2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }

# isthmus-link: finding other Isthmus computers, pairing with a code and
# sending files. Pure Rust throughout (no C or assembly to cross-compile), so
# the Windows build type-checks from a Mac. snow's `std` feature would pull in
# ring through a non-optional feature edge, so it stays off; snow is then
# no_std with alloc and its errors implement `core::error::Error`.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "macros"] }
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4.0"
hmac = "0.12.1"
sha2 = "0.10.9"
getrandom = "0.3.4"
# `logging` routes its `log` records (send failures among them, which is how
# a Local Network block shows) into tracing: `RUST_LOG=mdns_sd=trace`.
mdns-sd = { version = "0.22.0", default-features = false, features = ["logging"] }
if-addrs = "0.15.0"
socket2 = { version = "0.6.5", features = ["all"] }

# The app's update check: the Ed25519 signature over each release's
# manifest, checked in Rust as pb-mapper does (with ed25519-dalek, pure Rust
# like the rest of the stack, rather than pb-mapper's ring). The op takes
# its bytes as base64.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "fast"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }

# isthmus-awake's Windows power request. Already in the tree (tokio and
# socket2 use it); only the modules named.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }

# The macOS layer (isthmus-input's platform/macos): event taps, HID event
# system properties, the frontmost application, permissions and login items.
# The same objc2 family pb-mapper pins; only the headers used.
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "CFArray", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFPreferences", "CFRunLoop", "CFString", "CFUUID"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "libc", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSResponder"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "hid", "hidsystem", "pwr_mgt"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
