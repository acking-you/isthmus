name: CI

# The checks AGENTS.md lists under Verification, on every push to main and
# every pull request: the Rust workspace on macOS (the platform code is
# macOS-only), the Windows build linted from Linux (every crate is pure
# Rust), and the Flutter app.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  windows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} for Windows
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for Windows
        run: make check-windows

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Localizations are complete
        run: |
          flutter gen-l10n
          test "$(tr -d '[:space:]' < l10n_untranslated.json)" = "{}"
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Icons come from AppIcons
        run: "! grep -rnE '\\bIcons\\.' lib"
      - name: Test
        run: flutter test
