name: CI

# The checks AGENTS.md lists under Verification, on every push to main and
# every pull request: the Rust workspace on macOS, the Windows build linted
# from Linux (every crate is pure Rust) and its tests run on Windows itself,
# where file and power APIs differ, and the Flutter app.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  windows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} for Windows
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for Windows
        run: make check-windows

  # Lint from Linux catches what does not compile; this catches what behaves
  # differently: 0.1.0's state files could not be written on Windows, and
  # every test that writes one would have said so.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test on Windows
        run: cargo test --workspace --all-features
      # The one thing the tests never do is hold the real power request; a
      # CI runner may. Windows must list it under Isthmus's reason, and drop
      # it when the process ends.
      - name: The keep-awake request reaches Windows
        run: |
          cargo build -q -p isthmus-awake --example hold
          $hold = Start-Process target\debug\examples\hold.exe -ArgumentList '15' -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          $held = powercfg /requests | Out-String
          $held
          Wait-Process -Id $hold.Id
          $after = powercfg /requests | Out-String
          if ($held -notmatch 'Isthmus keeps this computer awake') { throw "powercfg does not list the request" }
          if ($after -match 'Isthmus keeps this computer awake') { throw "the request outlived its process" }

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Localizations are complete
        run: |
          flutter gen-l10n
          test "$(tr -d '[:space:]' < l10n_untranslated.json)" = "{}"
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Icons come from AppIcons
        run: "! grep -rnE '\\bIcons\\.' lib"
      - name: Test
        run: flutter test
